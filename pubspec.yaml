name: elder_launcher
description: A launcher focused on simplicity and legibility.
publish_to: 'none'
version: 1.6.0+12

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  auto_size_text: ^3.0.0  
  contacts_service: ^0.6.3
  device_apps: ^2.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  permission_handler: ^11.3.1
  provider: ^6.1.2
  shared_preferences: 2.2.2

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4

flutter:
  uses-material-design: true

flutter_intl:
  enabled: true
